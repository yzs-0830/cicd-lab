name: CI Pipeline (b11705005)

on:
  push:
    branches:
      - '**'

# Permissions required by EnricoMi/publish-unit-test-result-action
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Tests
        # Run vitest with both default (console) and junit reporters
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
        
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
